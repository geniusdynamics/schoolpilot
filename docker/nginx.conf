# ABOUTME: nginx for the built app: the security headers the app expects, the wasm MIME type, cache
# ABOUTME: rules that never freeze index.html or the runtime config, and the /config.js runtime hook.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    # A single-page app behind a hash router: any unknown path is the shell.
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Container health, for the Docker healthcheck and a load balancer alike.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The deployment's runtime settings, written by the entrypoint. Never cached long: a restart with
    # different settings must take effect on the next load. The service worker fetches it NetworkFirst.
    location = /config.js {
        include /etc/nginx/security-headers.conf;
        alias /tmp/schoolpilot/config.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache" always;
    }

    # Hashed bundles can be cached forever; the shell and the worker must not be.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /registerSW.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Streaming compilation needs the real type; nginx's default types map lacks it.
    location ~* \.wasm$ {
        include /etc/nginx/security-headers.conf;
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # COEP is deliberately absent: the SQLite VFS used here (opfs-sahpool) needs no SharedArrayBuffer,
    # and require-corp would break cross-origin images the policy allows.

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;

    # The app opens a database per origin and a service worker; a 2 MB request body is generous.
    client_max_body_size 2m;
}
