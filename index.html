<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SchoolPilot - Modern School Management</title>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <script type="module" src="/index.tsx" defer></script>
    <style>
      /* Basic Reset and Global Styles */
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
        background-color: #f3f4f6; /* Matches gray-100 */
        color: #1f2937; /* Matches gray-800 */
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      #root {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      
      /* Simple loading spinner styles (optional, if you don't want to rely solely on JS for this) */
      .app-loading {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-size: 1.2em;
        color: #4f46e5; /* Indigo color */
      }
      .app-loading .spinner {
        border: 4px solid rgba(0, 0, 0, 0.1);
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border-left-color: #4f46e5; /* Indigo color */
        animation: spin 1s ease infinite;
        margin-bottom: 10px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  <script type="importmap">
{

    "rxdb/plugins/leader-election": "https://esm.sh/rxdb@15.24.0/plugins/leader-election",
    "rxdb/plugins/update": "https://esm.sh/rxdb@15.24.0/plugins/update",
    "rxdb/plugins/query-builder": "https://esm.sh/rxdb@15.24.0/plugins/query-builder",
    "rxjs": "https://esm.sh/rxjs@7.8.1",
    "rxjs/operators": "https://esm.sh/rxjs@7.8.1/operators",
    "i18next": "https://esm.sh/i18next@23.11.5",
    "react-i18next": "https://esm.sh/react-i18next@14.1.2",
    "i18next-browser-languagedetector": "https://esm.sh/i18next-browser-languagedetector@8.0.0",
    "react-dom/": "https://esm.sh/react-dom@^19.1.0/",
    "react/": "https://esm.sh/react@^19.1.0/",
    "rxdb/": "https://esm.sh/rxdb@^16.15.0/",
    "rxjs/": "https://esm.sh/rxjs@^7.8.2/"
  }
}
</script>

</head>
