<!DOCTYPE html>
<html>
<head>
    <title>Debug Console</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        iframe { width: 100%; height: 600px; border: 1px solid #ccc; }
        .console { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .error { color: red; }
        .warning { color: orange; }
        .info { color: blue; }
    </style>
</head>
<body>
    <h1>SchoolPilot Debug Console</h1>
    <div id="status">Loading application...</div>
    <iframe id="appFrame" src="http://localhost:5200"></iframe>
    <div id="consoleOutput"></div>

    <script>
        const iframe = document.getElementById('appFrame');
        const consoleOutput = document.getElementById('consoleOutput');
        const status = document.getElementById('status');

        // Monitor iframe load events
        iframe.onload = function() {
            status.innerHTML = '<span style="color: green;">✓ Application loaded in iframe</span>';
            
            try {
                // Try to access iframe content (may be blocked by CORS)
                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                
                // Override console methods in iframe
                const iframeConsole = iframe.contentWindow.console;
                const originalLog = iframeConsole.log;
                const originalError = iframeConsole.error;
                const originalWarn = iframeConsole.warn;
                const originalInfo = iframeConsole.info;

                iframeConsole.log = function(...args) {
                    addConsoleMessage('log', args);
                    originalLog.apply(iframeConsole, args);
                };

                iframeConsole.error = function(...args) {
                    addConsoleMessage('error', args);
                    originalError.apply(iframeConsole, args);
                };

                iframeConsole.warn = function(...args) {
                    addConsoleMessage('warn', args);
                    originalWarn.apply(iframeConsole, args);
                };

                iframeConsole.info = function(...args) {
                    addConsoleMessage('info', args);
                    originalInfo.apply(iframeConsole, args);
                };

            } catch (e) {
                consoleOutput.innerHTML += '<div class="console error">CORS blocked: Cannot access iframe console. Check browser DevTools directly.</div>';
            }
        };

        iframe.onerror = function() {
            status.innerHTML = '<span style="color: red;">✗ Failed to load application</span>';
        };

        function addConsoleMessage(type, args) {
            const message = args.map(arg => 
                typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
            ).join(' ');
            
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : type === 'warn' ? 'warning' : 'info';
            
            consoleOutput.innerHTML += `<div class="console ${className}">[${timestamp}] ${type.toUpperCase()}: ${message}</div>`;
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        }

        // Also capture global errors
        window.addEventListener('error', function(e) {
            addConsoleMessage('error', [`Global error: ${e.message} at ${e.filename}:${e.lineno}:${e.colno}`]);
        });

        window.addEventListener('unhandledrejection', function(e) {
            addConsoleMessage('error', [`Unhandled promise rejection: ${e.reason}`]);
        });
    </script>
</body>
</html>
