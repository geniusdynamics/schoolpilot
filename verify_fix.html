<!DOCTYPE html>
<html>
<head>
    <title>Verify Data Mode Fix</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background-color: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background-color: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .info { background-color: #d1ecf1; border: 1px solid #bee5eb; color: #0c5460; }
        pre { background-color: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Data Mode Storage Key Fix Verification</h1>
    
    <div id="results"></div>
    
    <script>
        function displayResult(title, content, type = 'info') {
            const resultsDiv = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.innerHTML = `<h3>${title}</h3>${content}`;
            resultsDiv.appendChild(div);
        }

        function verifyFix() {
            // Clear any existing data
            localStorage.clear();
            
            // Test the new storage keys
            localStorage.setItem('app_data_mode', 'production');
            localStorage.setItem('app_data_mode_timestamp', Date.now().toString());
            
            // Check what's in localStorage
            const allStorage = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                allStorage[key] = localStorage.getItem(key);
            }
            
            displayResult('Current localStorage Contents', 
                `<pre>${JSON.stringify(allStorage, null, 2)}</pre>`, 'info');
            
            // Check for old keys (should not exist)
            const oldModeKey = localStorage.getItem('dataMode');
            const oldTimestampKey = localStorage.getItem('lastModeSwitch');
            
            if (oldModeKey === null && oldTimestampKey === null) {
                displayResult('Old Storage Keys Check', 
                    '✅ SUCCESS: No old storage keys found (dataMode, lastModeSwitch)', 'success');
            } else {
                displayResult('Old Storage Keys Check', 
                    `❌ ERROR: Found old keys - dataMode: ${oldModeKey}, lastModeSwitch: ${oldTimestampKey}`, 'error');
            }
            
            // Check for new keys (should exist)
            const newModeKey = localStorage.getItem('app_data_mode');
            const newTimestampKey = localStorage.getItem('app_data_mode_timestamp');
            
            if (newModeKey !== null && newTimestampKey !== null) {
                displayResult('New Storage Keys Check', 
                    `✅ SUCCESS: New keys found - app_data_mode: ${newModeKey}, app_data_mode_timestamp: ${newTimestampKey}`, 'success');
            } else {
                displayResult('New Storage Keys Check', 
                    `❌ ERROR: Missing new keys - app_data_mode: ${newModeKey}, app_data_mode_timestamp: ${newTimestampKey}`, 'error');
            }
            
            // Test the DataModeManager pattern
            displayResult('DataModeManager Pattern Test', 
                'The fix ensures that:<br>' +
                '1. Storage keys are consistent between UnifiedConfig and DataModeManager<br>' +
                '2. No conflicts when both systems try to manage the same data<br>' +
                '3. The data management settings page should load without issues<br>' +
                '4. Mode switching should work correctly', 'info');
        }
        
        // Run verification on page load
        verifyFix();
    </script>
</body>
</html>
