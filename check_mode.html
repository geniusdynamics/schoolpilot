<!DOCTYPE html>
<html>
<head>
    <title>Check Current Mode</title>
</head>
<body>
    <h1>Current Mode Check</h1>
    <div id="results"></div>
    
    <script>
        const results = document.getElementById('results');
        
        // Check both storage keys
        const dataModeManagerKey = localStorage.getItem('dataMode');
        const unifiedConfigKey = localStorage.getItem('app_data_mode');
        
        results.innerHTML = `
            <p><strong>DataModeManager key ('dataMode'):</strong> ${dataModeManagerKey || 'null'}</p>
            <p><strong>UnifiedConfig key ('app_data_mode'):</strong> ${unifiedConfigKey || 'null'}</p>
            <p><strong>NODE_ENV:</strong> ${typeof process !== 'undefined' ? process.env.NODE_ENV : 'undefined'}</p>
            <p><strong>All localStorage keys:</strong></p>
            <ul>
                ${Object.keys(localStorage).map(key => `<li>${key}: ${localStorage.getItem(key)}</li>`).join('')}
            </ul>
        `;
    </script>
</body>
</html>
